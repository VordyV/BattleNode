[project]
name = "battlenode"
version = "0.4.0"
description = ""
authors = [
    {name = "Vordy", email = "vladislavnetievsky@vordyv.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "packaging (>=24.2,<25.0)",
    "pymitter (>=1.0.0,<2.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "pydantic (>=2.11.3,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "anyio (>=4.9.0,<5.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "cryptography (>=44.0.2,<45.0.0)",
    "apscheduler (>=3.11.0,<4.0.0)",
    "redis (>=5.2.1,<6.0.0)",
    "email-validator (>=2.2.0,<3.0.0)",
    "bcrypt (>=4.3.0,<5.0.0)",
    "prompt-toolkit (>=3.0.52,<4.0.0)",
    "callixir (>=0.1.0,<0.2.0)",
    "aiohttp (>=3.13.3,<4.0.0)",
    "tornado (>=6.5.4,<7.0.0)",
    "tortoise-orm[aiomysql] (>=0.25.3,<0.26.0)",
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn[default] (>=0.40.0,<0.41.0)",
    "textual (>=7.5.0,<8.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pygments (>=2.19.2,<3.0.0)",
    "nuitka (>=2.8.10,<3.0.0)",
    "pyinstaller (>=6.18.0,<7.0.0)",
]
